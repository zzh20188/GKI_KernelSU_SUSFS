name: GetManager
permissions:
  contents: write
  actions: read

on:
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-24.04
    outputs:
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      susVer: ${{ steps.get_version.outputs.sversion }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NOVA_GITHUB_REPO: SukiSU-Nova/SukiSU-Nova

    steps:
      - name: 🧐 Debug Workflow Caller Context
        run: |
          echo "==================== DEBUG CONTEXT ===================="
          echo " "
          echo "EVENT NAME: ${{ github.event_name }}"
          echo " "
          echo "--- CALLER INFORMATION ---"
          echo "  - Caller Repository: ${{ github.caller_repository }}"
          echo "  - Caller Workflow:   ${{ github.caller_workflow }}"
          echo "  - Caller User:       ${{ github.triggering_actor }}"
          echo " "
          echo "--- WORKFLOW & JOB INFORMATION ---"
          echo "  - Current Workflow:  ${{ github.workflow }}"
          echo "  - Current Job ID:    ${{ github.job }}"
          echo "  - Current Run ID:    ${{ github.run_id }}"
          echo "  - Current Run Number:${{ github.run_number }}"
          echo " "
          echo "--- GIT REFERENCE INFORMATION ---"
          echo "  - Git Ref:           ${{ github.ref }}"
          echo "  - Ref Type:          ${{ github.ref_type }}"
          echo " "
          echo "======================================================="

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |
          set -euo pipefail

          # 重复执行时复用同一仓库，来源不符则报错，避免误算其他变体的版本。
          clone_kernelsu() {
            local repository="$1"
            if [ -d KernelSU/.git ]; then
              if [ "$(git -C KernelSU remote get-url origin)" != "$repository" ]; then
                echo "::error::已有 KernelSU 的来源与所选变体不同"
                return 1
              fi
            else
              git clone "$repository" KernelSU
            fi
          }

          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "This is the Next variant"
            clone_kernelsu https://github.com/KernelSU-Next/KernelSU-Next.git
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            echo "This is the SukiSU(40726) variant"
            clone_kernelsu https://github.com/SukiSU-Nova/SukiSU-Nova.git
            git -C KernelSU checkout 5da529942987b834c2b02a4819eaa298a8383bf4
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            echo "This is the SukiSU(40548) variant"
            clone_kernelsu https://github.com/SukiSU-Nova/SukiSU-Nova.git
            git -C KernelSU checkout 3170a48c508f6330ea636c51835a84573fe56ef5
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            echo "This is the BakaSU variant"
            clone_kernelsu https://github.com/Baka-SU/BakaSU.git
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "This is the Official"
            clone_kernelsu https://github.com/tiann/KernelSU.git
          else
            echo "Unknown variant"
            exit 1
          fi

          if [ "${{ inputs.kernelsu_variant }}" != "SukiSU" ]; then
            cd KernelSU
            KSU_GIT_VERSION=$(git rev-list --count HEAD)
          fi

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            # 管理器按 GitHub main 的版本判断；GitHub builtin 仍保留旧规则，不能用来筛新版 APK。
            MAIN_SHA=$(gh api "repos/$NOVA_GITHUB_REPO/commits/main" --jq '.sha')
            if ! [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::无法获取 SukiSU-Nova GitHub main 提交"
              exit 1
            fi
            # 每页只返回一个提交，最后一页的页码就是同一提交快照的历史数量。
            MAIN_COUNT=$(gh api --include "repos/$NOVA_GITHUB_REPO/commits?sha=$MAIN_SHA&per_page=1" |
              sed -nE '/^[Ll][Ii][Nn][Kk]:/s/.*[?&]page=([0-9]+)>; rel="last".*/\1/p')
            VERSION_RULE=$(gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$NOVA_GITHUB_REPO/contents/kernel/Kbuild?ref=$MAIN_SHA")
            VERSION_BASE=$(awk '$1 == "VERSION_BASE" {print $3; exit}' <<< "$VERSION_RULE")
            VERSION_OFFSET=$(awk '$1 == "VERSION_OFFSET" {print $3; exit}' <<< "$VERSION_RULE")
            OFFSET_SIGN=$(awk '$1 == "KSU_VERSION" && match($0, /[+-][[:space:]]*\$\(VERSION_OFFSET\)/) {print substr($0,RSTART,1); exit}' <<< "$VERSION_RULE")
            if ! [[ "$MAIN_COUNT" =~ ^[0-9]+$ && "$VERSION_BASE" =~ ^[0-9]+$ && "$VERSION_OFFSET" =~ ^[0-9]+$ && "$OFFSET_SIGN" =~ ^[+-]$ ]]; then
              echo "::error::无法从 GitHub main 解析 SukiSU-Nova 版本规则或提交数"
              exit 1
            fi
            # 加偏移量的新规则从 35000 开始，不能回退到旧规则的 30000 系列 APK。
            if [ "$OFFSET_SIGN" == "+" ]; then
              KSU_VERSION=$((VERSION_BASE + MAIN_COUNT + VERSION_OFFSET))
              NOVA_MIN_VERSION=35000
            else
              KSU_VERSION=$((VERSION_BASE + MAIN_COUNT - VERSION_OFFSET))
              NOVA_MIN_VERSION=$VERSION_BASE
            fi
            echo "SukiSU-Nova GitHub main 提交数: $MAIN_COUNT，Manager 版本上限: $KSU_VERSION"
            echo "NOVA_MIN_VERSION=$NOVA_MIN_VERSION" >> "$GITHUB_ENV"
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            KSU_VERSION=40726
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            KSU_VERSION=40548
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            KSU_VERSION=$((20000 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          fi
          echo "$KSU_VERSION"
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            SUS_VERSION="v2.1.0"
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            SUS_VERSION="v2.0.0"
          else
            INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop\?ref_type\=heads"
            SUS_VERSION=$(curl -s "$INFO" | awk -F '=' '$1 == "version" { print $2 }')
          fi
          echo "$SUS_VERSION"

          echo "kversion=$KSU_VERSION" >> "$GITHUB_OUTPUT"
          echo "sversion=$SUS_VERSION" >> "$GITHUB_OUTPUT"

      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU(40726)") LEGACY_RELEASE_TAG="v2.1.0-r2"; LEGACY_DIR="SukiSU_40726" ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_DIR="SukiSU_40548" ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "下载 ${{ inputs.kernelsu_variant }} 管理器..."
            mkdir -p "manager-artifacts/$LEGACY_DIR"
            MANAGER_URL=$(curl -fsSL "https://api.github.com/repos/zzh20188/GKI_KernelSU_SUSFS/releases/tags/$LEGACY_RELEASE_TAG" |
              jq -r '.assets[] | select(.name | startswith("SukiSU_") and endswith("-release.apk")) | .browser_download_url' |
              head -n 1)
            if [ -z "$MANAGER_URL" ]; then
              echo "未找到 ${{ inputs.kernelsu_variant }} 管理器下载地址。"
              exit 1
            fi
            curl -fL -o "manager-artifacts/$LEGACY_DIR/${LEGACY_DIR}-release.apk" "$MANAGER_URL"
            exit 0
          fi

          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "KernelSU Next..."
            REPO="KernelSU-Next/KernelSU-Next"
            KSUM="manager"
            BRANCH="dev"
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            echo "BakaSU..."
            REPO="Baka-SU/BakaSU"
            KSUM="manager"
            BRANCH="main"
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "KSU..."
            REPO="tiann/KernelSU"
            KSUM="manager"
          fi

          FILENAME=$([[ "${{ inputs.kernelsu_variant }}" == "Next" ]] && echo "build-manager-ci.yml" || echo "build-manager.yml")


          # 按内核 KSU 版本选择 Manager，避免 APK 版本领先于内核版本
          TARGET_KSU_VERSION="${KSU_VERSION:-}"
          if ! [[ "$TARGET_KSU_VERSION" =~ ^[0-9]+$ ]]; then
            echo "无效的目标 KSU 版本: $TARGET_KSU_VERSION"
            exit 1
          fi

          download_nova_manager() (
            local candidates name url tmp_dir
            # 正式 Release 的标签可能早于附件更新，版本号以官方 APK 文件名为准。
            candidates=$(
              {
                gh api "repos/$NOVA_GITHUB_REPO/releases?per_page=20" || true
                printf '\n'
                gh api "repos/$NOVA_GITHUB_REPO/releases/tags/manager-ci" || true
              } | jq -sr --argjson min "$NOVA_MIN_VERSION" --argjson max "$TARGET_KSU_VERSION" \
                --arg source "https://github.com/$NOVA_GITHUB_REPO/releases/download/" '
                [ .[] | if type == "array" then .[] else . end | select(.draft != true) | .assets[]? |
                  select(.browser_download_url | strings | startswith($source)) |
                  (.name | capture("^SukiSU_Nova_[A-Za-z0-9._-]+_(?<version>[0-9]+)-arm64-v8a-release\\.apk$")) as $apk |
                  ($apk.version | tonumber) as $version | select($version >= $min and $version <= $max) |
                  [$version, .name, .browser_download_url]
                ] | sort_by(-.[0])[] | .[1:] | @tsv') || return 1
            [ -n "$candidates" ] || return 1

            tmp_dir=$(mktemp -d) || return 1
            trap 'rm -rf -- "$tmp_dir"' EXIT
            mkdir "$tmp_dir/apks" || return 1
            while IFS=$'\t' read -r name url; do
              if curl -fsSL --retry 2 --connect-timeout 8 --max-time 90 -o "$tmp_dir/download.apk" "$url"; then
                mv -- "$tmp_dir/download.apk" "$tmp_dir/apks/$name" || return 1
                mkdir -p manager-artifacts && rm -rf -- manager-artifacts/SukiSU-Nova && \
                  mv -- "$tmp_dir/apks" manager-artifacts/SukiSU-Nova || return 1
                echo "已下载 $name"
                return 0
              fi
              echo "::warning::下载 $name 失败，尝试其他可用附件"
            done <<< "$candidates"
            return 1
          )

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            if ! download_nova_manager; then
              echo "::warning::未找到可下载且与 KSU $TARGET_KSU_VERSION 同版本系列的 SukiSU-Nova arm64-v8a Manager"
              exit 1
            fi
            exit 0
          fi

          calculate_run_ksu_version() {
            local head_sha="$1"
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              git -C KernelSU fetch --no-tags origin "$head_sha" >/dev/null 2>&1 || true
            fi
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              return 1
            fi

            local git_version
            git_version=$(git -C KernelSU rev-list --count "$head_sha")
            case "${{ inputs.kernelsu_variant }}" in
              "BakaSU") echo $((30700 + git_version)) ;;
              "Official") echo $((20000 + git_version)) ;;
              "Next") echo $((30000 + git_version)) ;;
              *) return 1 ;;
            esac
          }

          get_manager_artifacts() {
            local artifacts="$1"
            if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
              printf '%s' "$artifacts" | jq -r --arg name "$KSUM" \
                '.artifacts[] | select(.name == $name) | "\(.name)\t\(.archive_download_url)"'
            elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
              printf '%s' "$artifacts" | jq -r \
                '.artifacts[] | select(.name == "Manager-release" and (.expired | not)) | "\(.name)\t\(.archive_download_url)"'
            else
              printf '%s' "$artifacts" | jq -r --arg needle "$KSUM" \
                '.artifacts[] | select((.name | ascii_downcase) | contains($needle)) | "\(.name)\t\(.archive_download_url)"'
            fi
          }

          download_bakasu_manager() (
            local name="$1" url="$2" tmp_dir
            tmp_dir=$(mktemp -d) || return 1
            trap 'rm -rf -- "$tmp_dir"' EXIT
            echo "下载 $name..."
            curl -fL --retry 3 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o "$tmp_dir/manager.zip" "$url" || return 1
            unzip -qj "$tmp_dir/manager.zip" '*-arm64-v8a-release.apk' \
              -d "$tmp_dir/apks" || return 1
            find "$tmp_dir/apks" -type f -name '*debug*.apk' -delete || return 1
            local apks=("$tmp_dir/apks/"*.apk)
            if [ "${#apks[@]}" -ne 1 ] || [ ! -f "${apks[0]}" ]; then
              echo "::warning::$name 未提供唯一的 BakaSU arm64-v8a release APK"
              return 1
            fi
            # 同一构建的两种 APK 可能同名，Release 按文件名区分附件。
            if [ "$name" == "Spoofed-Manager-release" ]; then
              mv -- "${apks[0]}" "${apks[0]%.apk}-spoofed.apk" || return 1
            fi

            mkdir -p manager-artifacts && rm -rf -- "manager-artifacts/$name" && \
              mv -- "$tmp_dir/apks" "manager-artifacts/$name"
          )

          download_bakasu_spoof() {
            local build_id head_sha url version
            # 上游已停产 Spoof 版，独立回溯历史产物，不让旧 APK 替换普通版。
            while IFS=$'\t' read -r build_id head_sha url; do
              version=$(calculate_run_ksu_version "$head_sha") || continue
              if ! [[ "$version" =~ ^[0-9]+$ ]] || [ "$version" -gt "$TARGET_KSU_VERSION" ]; then
                continue
              fi
              # 只接受上游主分支成功且非 PR 的构建，避免附上开发测试版。
              if ! gh api "repos/$REPO/actions/runs/$build_id" | jq -e '
                .path == ".github/workflows/build-manager.yml" and .conclusion == "success" and
                (.event == "push" or .event == "workflow_dispatch")' >/dev/null; then
                continue
              fi
              if download_bakasu_manager "Spoofed-Manager-release" "$url"; then
                echo "已附带 BakaSU Spoofed Manager：构建 $build_id，KSU $version（目标内核 KSU $TARGET_KSU_VERSION）"
                return 0
              fi
            done < <(gh api --paginate "repos/$REPO/actions/artifacts?name=Spoofed-Manager-release&per_page=100" --jq '
              .artifacts[] | select(.name == "Spoofed-Manager-release" and (.expired | not)) |
              select(.workflow_run.head_branch == "main" and .workflow_run.repository_id == .workflow_run.head_repository_id) |
              [.workflow_run.id, .workflow_run.head_sha, .archive_download_url] | @tsv')
            return 1
          }

          DOWNLOAD_LIST=""
          BEST_VERSION=0
          BEST_BUILD_ID=""
          BEST_BRANCH=""
          RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success&per_page=30"
          # 已指定分支的变体按该分支查找，避免取到开发分支的 APK。
          if [ -n "${BRANCH:-}" ]; then
            RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?branch=$BRANCH&status=success&per_page=30"
          fi

          echo "开始查找不高于 KSU $TARGET_KSU_VERSION 的 Manager 产物..."
          for PAGE in $(seq 1 10); do
            echo "--------------------------------------------------"
            echo "正在检查第 ${PAGE} 页历史构建..."
            RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RUNS_URL&page=$PAGE")
            RUN_COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length')
            if [ "$RUN_COUNT" -eq 0 ]; then
              break
            fi

            for INDEX in $(seq 0 $((RUN_COUNT - 1))); do
              BUILD_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id")
              HEAD_SHA=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_sha")
              HEAD_BRANCH=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_branch")

              if [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ] && ! printf '%s' "$RUNS" | jq -e \
                ".workflow_runs[$INDEX].event | . == \"push\" or . == \"workflow_dispatch\"" >/dev/null; then
                continue
              fi

              RUN_KSU_VERSION=$(calculate_run_ksu_version "$HEAD_SHA" || true)
              if ! [[ "$RUN_KSU_VERSION" =~ ^[0-9]+$ ]]; then
                echo "跳过构建 $BUILD_ID: 无法根据提交 $HEAD_SHA 计算 KSU 版本"
                continue
              fi
              if [ "$RUN_KSU_VERSION" -gt "$TARGET_KSU_VERSION" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): Manager KSU $RUN_KSU_VERSION 高于内核 KSU $TARGET_KSU_VERSION"
                continue
              fi

              ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")
              CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
              if [ -z "$CANDIDATE_LIST" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): 未找到包含 '$KSUM' 的产物"
                continue
              fi

              if [ -z "$DOWNLOAD_LIST" ] || [ "$RUN_KSU_VERSION" -gt "$BEST_VERSION" ]; then
                DOWNLOAD_LIST="$CANDIDATE_LIST"
                BEST_VERSION="$RUN_KSU_VERSION"
                BEST_BUILD_ID="$BUILD_ID"
                BEST_BRANCH="$HEAD_BRANCH"
                echo "候选 Manager: 构建 $BUILD_ID ($HEAD_BRANCH), KSU $RUN_KSU_VERSION"
              fi

              if [ "$RUN_KSU_VERSION" -eq "$TARGET_KSU_VERSION" ]; then
                break 2
              fi
            done
          done

          if [ -z "$DOWNLOAD_LIST" ]; then
            echo "未获取到 KSU 版本小于等于 $TARGET_KSU_VERSION 的 Manager artifact 下载地址列表。"
            exit 1
          fi
          echo "选择 Manager 构建 $BEST_BUILD_ID ($BEST_BRANCH), KSU $BEST_VERSION"

          if [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            IFS=$'\t' read -r NAME URL <<< "$DOWNLOAD_LIST"
            download_bakasu_manager "$NAME" "$URL" || exit 1
            rm -rf -- manager-artifacts/Spoofed-Manager-release
            if ! download_bakasu_spoof; then
              echo "::warning::没有可下载且版本不高于目标内核的 BakaSU Spoofed Manager，本次仅附带普通版。"
            fi
            find manager-artifacts -type f -name "*.apk" -print
          else
            echo "$DOWNLOAD_LIST" | while IFS=$'\t' read -r NAME URL; do
              SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
              ZIP_NAME="${{ inputs.kernelsu_variant }}-${SAFE_NAME}(${{ env.KSU_VERSION }}).zip"
              echo "下载 $NAME -> $ZIP_NAME"
              curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$ZIP_NAME" "$URL"
              mkdir -p "manager-artifacts/$SAFE_NAME"
              unzip -o "$ZIP_NAME" -d "manager-artifacts/$SAFE_NAME"
              rm -rf "$ZIP_NAME"
            done
          fi

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        run: |
          set -euo pipefail

          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU(40726)") LEGACY_RELEASE_TAG="v2.1.0-r2"; LEGACY_SUSFS_VERSION="v2.1.0" ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_SUSFS_VERSION="v2.0.0" ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "下载 ${{ inputs.kernelsu_variant }} 对应的 SUSFS 模块..."
            mkdir -p susfs-module
            curl -fL -o susfs-module/ksu_module_susfs.zip \
              "https://github.com/zzh20188/GKI_KernelSU_SUSFS/releases/download/$LEGACY_RELEASE_TAG/ksu_module_susfs.zip"
            echo "SUSFS_NAME=$LEGACY_SUSFS_VERSION" >> "$GITHUB_ENV"
            exit 0
          fi

          API_ROOT="https://api.github.com/repos/sidex15/susfs4ksu-module"
          CURL_ARGS=(--fail-with-body --silent --show-error --location
            --retry 3 --retry-all-errors --retry-delay 2
            --connect-timeout 15 --max-time 120)
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT

          # 响应先写入文件，避免重试时将多份响应拼接成无效 JSON。
          github_api() {
            : > "$WORKDIR/api.json"
            if ! curl "${CURL_ARGS[@]}" -H "Authorization: Bearer $GH_TOKEN" \
              -o "$WORKDIR/api.json" "$1"; then
              echo "::error::GitHub API 请求重试后仍失败: $1" >&2
              if [ -s "$WORKDIR/api.json" ]; then
                cat "$WORKDIR/api.json" >&2
              fi
              return 1
            fi
            cat "$WORKDIR/api.json"
          }

          RUNS=$(github_api "$API_ROOT/actions/workflows/build.yml/runs?status=success&per_page=30")
          if ! BUILD_IDS=$(jq -er '
            .workflow_runs | if type != "array" then error("构建列表不是数组")
            else .[] | .id | select(type == "number" and . > 0 and . == floor) end
          ' <<< "$RUNS"); then
            echo "::error::SUSFS 构建列表无效或没有成功构建" >&2
            exit 1
          fi

          DOWNLOAD_URL=""
          NAME=""
          while IFS= read -r BUILD_ID; do
            ARTIFACTS=$(github_api "$API_ROOT/actions/runs/$BUILD_ID/artifacts?per_page=100")
            if ! CANDIDATE=$(jq -c --arg prefix "$API_ROOT/actions/artifacts/" '
              if (.artifacts | type) != "array" then error("产物列表不是数组")
              else [.artifacts[]
                | select(.expired == false)
                | select(.name | strings | test("^[^\\r\\n]+$"))
                | select(.archive_download_url | strings | startswith($prefix))
                | select(.archive_download_url | ltrimstr($prefix) | test("^[1-9][0-9]*/zip$"))
              ][0] // empty end
            ' <<< "$ARTIFACTS"); then
              echo "::error::SUSFS 构建 $BUILD_ID 的产物列表无效" >&2
              exit 1
            fi
            if [ -z "$CANDIDATE" ]; then
              echo "::warning::SUSFS 构建 $BUILD_ID 没有可用产物，继续检查历史构建"
              continue
            fi
            NAME=$(jq -r '.name' <<< "$CANDIDATE")
            DOWNLOAD_URL=$(jq -r '.archive_download_url' <<< "$CANDIDATE")
            echo "选择 SUSFS 模块: 构建 $BUILD_ID，产物 $NAME"
            break
          done <<< "$BUILD_IDS"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::最近 30 次成功构建中没有未过期且下载地址有效的 SUSFS 模块产物" >&2
            exit 1
          fi

          curl "${CURL_ARGS[@]}" -H "Authorization: Bearer $GH_TOKEN" \
            -o "$WORKDIR/artifact.zip" "$DOWNLOAD_URL"
          unzip -q "$WORKDIR/artifact.zip" -d "$WORKDIR/extracted"

          mkdir -p "$WORKDIR/module"
          shopt -s nullglob
          MODULE_ZIPS=("$WORKDIR/extracted/"*.zip)
          if [ "${#MODULE_ZIPS[@]}" -gt 0 ]; then
            cp -- "${MODULE_ZIPS[@]}" "$WORKDIR/module/"
          else
            (cd "$WORKDIR/extracted" && zip -qr "$WORKDIR/module/ksu_module_susfs.zip" .)
          fi

          # 成功后再替换输出目录，重复执行时不残留旧模块或不完整下载。
          rm -rf susfs-module
          mv "$WORKDIR/module" susfs-module
          echo "SUSFS_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SUSFS 模块已下载并整理完成"

      - name: 提示 SUSFS 模块下载失败
        if: steps.add_SUSFS.outcome == 'failure'
        run: echo "::warning::SUSFS 模块下载失败，本次不附带模块 ZIP；不影响 Manager APK 和内核构建。"

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "下载CI构建的KSU失败!"

      - name: 上传APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.KSU_VERSION }})
          path: |
            manager-artifacts/**/*.apk

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
