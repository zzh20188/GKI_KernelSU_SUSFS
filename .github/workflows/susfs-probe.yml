name: SUSFS 原始补丁探测

# 这是放在默认分支上的空壳：GitHub 只列出默认分支上存在的 workflow_dispatch 工作流。
# 真正的探测逻辑在长期工具分支 susfs-probe 上（同名文件），运行时在 Actions 页面的
# 「Use workflow from」里选择 susfs-probe 分支即可；本文件的输入必须与工具分支保持一致。
# 在 dev 上直接运行只会打印提示，不会构建任何东西。

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "内核版本（all = 全部分支）"
        required: true
        type: choice
        options:
          - all
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: all
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - SukiSU
          - ReSukiSU
          - Official
        default: SukiSU
      sub_level_min:
        description: "最小子版本号（留空不限）"
        required: false
        type: string
        default: ""
      sub_level_max:
        description: "最大子版本号（留空不限）"
        required: false
        type: string
        default: ""
      os_patch_levels:
        description: "只探测这些安全补丁月份，逗号分隔（留空不限，如 2025-03,2025-07）"
        required: false
        type: string
        default: ""
      include_lts:
        description: "同时探测 LTS 分支"
        required: false
        type: boolean
        default: true
      susfs_side_fixes:
        description: "保留与子版本无关的 SUSFS 侧修复（5.10 上游补丁自身的两处编译缺陷）"
        required: false
        type: boolean
        default: false
      susfs_pin_time:
        description: "susfs4ksu 固定到该时刻之前的最后一次提交（ISO 8601，留空 = 本次运行开始时刻）"
        required: false
        type: string
        default: ""
      upload_kernels:
        description: "上传编译出的 AnyKernel3 包（默认只留探测结论）"
        required: false
        type: boolean
        default: false
      max_parallel:
        description: "最大并行任务数"
        required: false
        type: string
        default: "20"
      data_source:
        description: "版本数据与已有探测结果的来源分支"
        required: false
        type: string
        default: dev

jobs:
  notice:
    name: 请选择 susfs-probe 分支运行
    runs-on: ubuntu-latest
    steps:
      - name: 提示
        run: |
          echo "::error::这是 dev 上的空壳工作流，不会构建任何东西。"
          echo "::error::请在 Run workflow 的「Use workflow from」里选择分支 susfs-probe 后再运行。"
          exit 1
