# 一次性维护任务：仅删除已核验 Squash 合并的 OTA 助手临时分支。
# dev 合并该文件时运行一次；成功后通过 GitHub Contents API 移除本文件。
name: "小米17 Pro OS4 / 一次性清理已合并开发分支"
on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/pandora-ota-prune-merged-branches-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 核实 PR 已合并与精确分支指针后删除
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # 不做通配符清理：只操作两条已经 Squash 合并的明确开发分支。
          entries=(
            "feat/pandora-ota-0132-d02-evidence|80|d7a048f6b1f8adecfea3e90726dfde98a0189287|95ff0a45e0ceb4903ebce791dd9d582efe30db59"
            "feat/pandora-ota-0133-software-revision-evidence|81|829b95a43592cfc28366237a64a2b74697fabdab|14ff5745ee27fcd10189c77985fdc6e4e0f60051"
          )
          for entry in "${entries[@]}"; do
            IFS='|' read -r ref pr expected_sha merged_sha <<< "$entry"
            echo "::group::核对 $ref"
            ref_json="$(gh api "repos/$repo/git/ref/heads/$ref")"
            actual_sha="$(jq -r '.object.sha' <<< "$ref_json")"
            [[ "$actual_sha" == "$expected_sha" ]] || {
              echo "::error::$ref head 发生变化，拒绝删除"; exit 1;
            }
            pr_json="$(gh api "repos/$repo/pulls/$pr")"
            jq -e --arg head "$ref" --arg sha "$expected_sha" --arg merge "$merged_sha" '
              .merged_at != null and .head.ref == $head and .head.sha == $sha and
              .base.ref == "dev" and .merge_commit_sha == $merge' <<< "$pr_json" >/dev/null || {
              echo "::error::PR #$pr 合并记录不符，拒绝删除"; exit 1;
            }
            if gh api --paginate "repos/$repo/pulls?state=open&per_page=100" --jq '.[].head.ref' |
                grep -Fxq "$ref"; then
              echo "::error::$ref 仍被未合并 PR 引用，拒绝删除"; exit 1
            fi
            gh api -X DELETE "repos/$repo/git/refs/heads/$ref" >/dev/null
            echo "::notice::已删除已合并分支 $ref"
            echo "::endgroup::"
          done
      - name: 删除本次维护 PR 的分支（仅限已合并）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          ref="chore/pandora-d02-archive-ui-branch-prune-20261115"
          merged="$(gh api --paginate -X GET "repos/$repo/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.head.ref == "chore/pandora-d02-archive-ui-branch-prune-20261115" and .merged_at != null) | .head.sha' | head -n 1)"
          [[ -n "$merged" ]] || { echo "::error::维护 PR 尚未合并"; exit 1; }
          actual="$(gh api "repos/$repo/git/ref/heads/$ref" --jq .object.sha)"
          [[ "$actual" == "$merged" ]] || { echo "::error::维护分支指针已变化，拒绝删除"; exit 1; }
          gh api -X DELETE "repos/$repo/git/refs/heads/$ref" >/dev/null
          echo "::notice::已删除本次维护分支"
      - name: 一次性任务完成后移除自身工作流
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          path=".github/workflows/pandora-ota-prune-merged-branches-once.yml"
          sha="$(gh api "repos/$repo/contents/$path?ref=dev" --jq .sha)"
          [[ -n "$sha" ]] || { echo "::error::无法读取一次性工作流文件"; exit 1; }
          gh api -X DELETE "repos/$repo/contents/$path" \
            -f message="chore(pandora): remove completed one-off branch cleanup workflow" \
            -f sha="$sha" -f branch=dev >/dev/null
          echo "::notice::已移除一次性清理工作流（不会保留实验 Actions）"
